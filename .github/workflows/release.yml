name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Canonical version tag to release, e.g. v0.3.0. Must match the package.json version and exist in the repository."
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    steps:
      - name: Resolve release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="$MANUAL_TAG"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RAW="$RELEASE_TAG"
          else
            echo "Unsupported release event: ${{ github.event_name }}" >&2
            exit 1
          fi
          TAG="$RAW"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a canonical v-prefixed semver tag: $TAG" >&2
            exit 1
          fi
          REF="refs/tags/$TAG"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install and verify npm 11.5.1
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version
          test "$(npm --version)" = "11.5.1"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION=$(npm pkg get version | tr -d '"')
          TAG="$RELEASE_TAG"
          TAG="${TAG#v}"
          if [ -z "$TAG" ] || [ "$VERSION" != "$TAG" ]; then
            echo "Release tag '${TAG}' does not match package version '${VERSION}'" >&2
            exit 1
          fi

      - name: Verify checkout is the release tag commit
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
        run: |
          HEAD_COMMIT=$(git rev-parse HEAD)
          TAG_COMMIT=$(git rev-parse "${RELEASE_REF}^{commit}")
          if [ "$HEAD_COMMIT" != "$TAG_COMMIT" ]; then
            echo "Checked-out commit '$HEAD_COMMIT' is not the release tag commit '$TAG_COMMIT'" >&2
            exit 1
          fi

      - name: Clean install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run npm tests
        run: npm test

      - name: Syntax and schema drift checks
        run: npm run check

      - name: Contract verification
        run: npm run contracts:verify

      - name: Deterministic StatusArtifact smoke
        run: npm run smoke:status-artifact

      - name: Truth Tools smoke
        env:
           TRUTH_TOOLS_VERSION: "0.4.0"
        run: |
          INSTALLED_TRUTH_TOOLS_VERSION=$(npx --yes "truth-tools@${TRUTH_TOOLS_VERSION}" --version)
          test "$INSTALLED_TRUTH_TOOLS_VERSION" = "$TRUTH_TOOLS_VERSION"
           npx --yes "truth-tools@${TRUTH_TOOLS_VERSION}" review --input examples/status-artifact.json --format json > "$RUNNER_TEMP/truth-review.json"
           node -e 'const fs=require("fs"); const review=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/truth-review.json", "utf8")); if (review.artifact_quality !== "pass" || review.program_health !== "blocked") { throw new Error(`unexpected Truth Tools review: ${JSON.stringify(review)}`); }'
           npx --yes "truth-tools@${TRUTH_TOOLS_VERSION}" review --input examples/status-artifact-on-track.json --format json > "$RUNNER_TEMP/truth-review-on-track.json"
           node -e 'const fs=require("fs"); const review=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/truth-review-on-track.json", "utf8")); if (review.artifact_quality !== "pass" || review.program_health !== "on_track" || review.health_consistency !== "consistent") { throw new Error(`unexpected Truth Tools on-track review: ${JSON.stringify(review)}`); }'

      - name: CLI smoke tests
        run: |
          node bin/program-truth.js version
          SMOKE_HOME="$RUNNER_TEMP/pt-cli"
          mkdir -p "$SMOKE_HOME"
          node bin/program-truth.js install codex --target "$SMOKE_HOME/codex"
          node bin/program-truth.js install claude --target "$SMOKE_HOME/claude"
          node bin/program-truth.js doctor --codex-target "$SMOKE_HOME/codex" --claude-target "$SMOKE_HOME/claude"
          node bin/program-truth.js bootstrap --workspace "$RUNNER_TEMP/pt-bootstrap" --client none --dry-run

      - name: Package dry run
        run: npm run pack:dry-run

      - name: Publish with provenance
        run: npm publish --provenance --access public
